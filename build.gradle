plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.143'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version

    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    runs {
        client {
            client()
        }

        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'com.google.code.gson:gson:2.10.1'
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

tasks.named('jar', Jar).configure {
    from('LICENSE') {
        into('META-INF')
        rename { 'LICENSE_boundednotfree' }
    }
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// Optional integration harness; third-party JARs belong in run/genesis-compat-{client,server}/mods.
if (providers.gradleProperty('compatTest').isPresent()) {
    def compatSource = sourceSets.create('compatTest')
    compatSource.compileClasspath += sourceSets.main.output
    compatSource.runtimeClasspath += sourceSets.main.output
    neoForge.addModdingDependenciesTo(compatSource)
    neoForge.mods {
        boundednotfree_compat_test { sourceSet(compatSource) }
    }
    neoForge.runs {
        genesisCompatClient {
            client()
            sourceSet = compatSource
            gameDirectory = file('run/genesis-compat-client')
        }
        genesisCompatAbsentClient {
            client()
            sourceSet = compatSource
            gameDirectory = file('run/genesis-compat-absent-client')
        }
        genesisCompatServer {
            server()
            sourceSet = compatSource
            gameDirectory = file('run/genesis-compat-server')
            programArgument '--nogui'
        }
    }
}

if (providers.gradleProperty('compatTest').isPresent()) {
    ['Client': 'client', 'Server': 'server', 'AbsentClient': 'absent-client'].each { side, directory ->
        def resultFile = layout.projectDirectory.file("run/genesis-compat-${directory}/compat-result.txt").asFile
        tasks.named("runGenesisCompat${side}") {
            doFirst { resultFile.delete() }
            doLast {
                if (!resultFile.isFile() || !resultFile.text.startsWith('PASS:')) {
                    throw new GradleException("Compatibility check failed: ${resultFile.isFile() ? resultFile.text : 'no result'}")
                }
            }
        }
    }
}
